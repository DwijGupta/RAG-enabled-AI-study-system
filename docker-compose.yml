version: "3.8"

# ==============================================================================
# AI Study Buddy System - Lightweight Docker Compose Setup
# Designed for fast local development and light resource usage:
# - Frontend: React Vite SPA via Nginx (Port 3000)
# - Backend: FastAPI Server with SQLite & NetworkX graph (Port 8000)
# - Vector DB: Lightweight Qdrant (Ports 6333, 6334)
# ==============================================================================

networks:
  studybuddy-net:
    driver: bridge

volumes:
  qdrant_storage:
    name: studybuddy_qdrant_data
  backend_data:
    name: studybuddy_backend_storage

services:
  # ----------------------------------------------------------------------------
  # 1. Qdrant Vector Database (Lightweight Vector Engine)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: studybuddy-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - studybuddy-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. FastAPI Application Backend (Lightweight Setup)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studybuddy-backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "Learner-State-Aware RAG Educational Tutor"
      DEBUG: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DATABASE_URL: "sqlite+aiosqlite:///app/data/studybuddy.db"
      STORAGE_DIR: "/app/data/storage"
      DATA_DIR: "/app/data"
      QDRANT_URL: "http://qdrant:6333"
      NEO4J_URI: ""
      LANGFUSE_ENABLED: "false"
    volumes:
      - backend_data:/app/data
    networks:
      - studybuddy-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. React Vite Frontend (Reverse Proxy & Student Interface)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studybuddy-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - studybuddy-net
